name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure tail"
            tail -n 120 gradle-build.log
            echo "::endgroup::"
            {
              echo "Gradle build failed. Last 80 log lines:"
              tail -n 80 gradle-build.log
            } > gradle-error.txt
            message=$(python3 - <<'PY'
from pathlib import Path
text = Path("gradle-error.txt").read_text(errors="replace")
text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
print(text)
PY
)
            echo "::error title=Gradle build failed::$message"
            exit "$status"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quit-smoke-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: quit-smoke-debug
          path: apk/debug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
